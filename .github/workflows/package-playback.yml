name: Verify released FlashGuard desktop playback
on:
  pull_request:
    paths:
      - '.github/workflows/package-playback.yml'
      - 'desktop/verify_release.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            package: macOS-arm64
          - runner: macos-15-intel
            package: macOS-x64
          - runner: ubuntu-22.04
            package: Linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify the public archive
        env:
          PLATFORM: ${{ matrix.package }}
        run: |
          archive="FlashGuard-${PLATFORM}.tar.gz"
          base=https://github.com/Cierijr/FlashGuard/releases/download/desktop-unix-preview-1-1
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.sha256"
          shasum -a 256 -c "$archive.sha256"
          tar -xzf "$archive"
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.58.0
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth tk
            python -m playwright install --with-deps chromium firefox
          else
            python -m playwright install chromium firefox
          fi
      - name: Verify analysis and video playback
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python desktop/verify_release.py FlashGuard
          else
            python desktop/verify_release.py FlashGuard
          fi
